<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin.css">
<title>管理後台 · 一鍵對講</title>
</head>
<body>
<div class="admin">
  <header class="topbar">
    <strong>🛠️ 管理後台</strong>
    <div class="me"><span id="who"></span> <a class="link" href="/">回對講</a> <button id="logout" class="link">登出</button></div>
  </header>

  <section id="loginBox" class="card hidden">
    <h2>管理員登入</h2>
    <form id="loginForm">
      <input id="username" placeholder="帳號" autocomplete="username" autocapitalize="none">
      <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
      <button class="primary" type="submit">登入</button>
      <p id="loginErr" class="err"></p>
    </form>
  </section>

  <section id="denied" class="card hidden"><h2>需要管理員權限</h2><p>你的帳號不是管理員，無法使用後台。</p></section>

  <div id="panels" class="hidden">
    <section class="card" id="alertsCard">
      <h2>🚨 進行中的警報</h2>
      <ul id="alertList" class="list"></ul>
    </section>

    <section class="card">
      <h2>使用者</h2>
      <form id="newUser" class="grid-form">
        <input id="nuUsername" placeholder="帳號（英數字）" autocapitalize="none" required>
        <input id="nuName" placeholder="顯示名稱">
        <input id="nuPassword" type="text" placeholder="密碼（留空自動產生）">
        <select id="nuRole"><option value="user">一般使用者</option><option value="admin">管理員</option></select>
        <button class="primary" type="submit">建立使用者</button>
      </form>
      <p id="newPw" class="notice hidden"></p>
      <table class="tbl"><thead><tr><th>帳號</th><th>名稱</th><th>身分</th><th>狀態</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table>
    </section>

    <section class="card">
      <h2>頻道</h2>
      <form id="newChannel" class="grid-form">
        <input id="ncName" placeholder="頻道名稱" required>
        <label class="chk"><input type="checkbox" id="ncOpen"> 開放（所有人可加入，預設角色「一般」）</label>
        <button class="primary" type="submit">建立頻道</button>
      </form>
      <div id="channelCards"></div>
    </section>
    <p class="muted small">角色說明：主管＝可講、優先權高（可中斷一般成員）；一般＝可講；只聽＝只能收聽。管理員在未指派的頻道預設為主管。發出緊急警報的人在警報期間擁有最高發話權。</p>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/admin.js"></script>
</body>
</html>
