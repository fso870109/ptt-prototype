# Render Blueprint：把免費 Postgres 的連線字串接到 web service（DATABASE_URL）
# 兩者都是 free 方案、新加坡機房。ADMIN_PASSWORD 不放在這裡（sync: false，到 Render 後台或 API 設定）。
services:
  - type: web
    name: ptt-prototype
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ptt-prototype-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: ptt-prototype-db
    plan: free
    region: singapore
    databaseName: ptt_prototype_db
    user: ptt_prototype_db_user
    postgresMajorVersion: "16"
